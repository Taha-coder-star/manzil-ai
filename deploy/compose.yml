# Demo deployment: web + worker from one image, Caddy for public HTTPS.
# Run from the repo root on the server:
#   docker compose -f deploy/compose.yml --env-file .env build
#   docker compose -f deploy/compose.yml --env-file .env up -d
services:
  web:
    build: ..
    image: manzil-ai:latest
    command: ["web"]
    env_file: ../.env
    restart: unless-stopped

  worker:
    image: manzil-ai:latest
    pull_policy: never
    command: ["worker"]
    env_file: ../.env
    restart: unless-stopped
    # SIGTERM stops new claims; running turns (up to ~50 s of provider time) finish
    # instead of being killed after Docker's default 10 s (audit MA-011).
    stop_grace_period: 90s

  caddy:
    # Pinned by digest (docs/release/RELEASE.md: refreshing the pins).
    image: caddy:2@sha256:9c1b76fb701c1f77383d3124d9f626e38bcf83bc1255ed47475d4f2420701d03
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
