name: Manzil AI CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: manzil_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: manzil_schema_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manzil_test -d manzil_schema_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      REQUIRE_DATABASE_TESTS: "1"
      TEST_DATABASE_URL: postgresql://manzil_test:local_test_only@127.0.0.1:5432/manzil_schema_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check app tests

      - name: Unit, migration, and restricted-login RLS tests
        run: python -m pytest -q

      - name: Scan Git history for secrets
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            zricethezav/gitleaks:v8.24.2 \
            git /repo --redact

      - name: Build shared image
        run: docker build -t manzil-ai:ci .

      - name: Verify migration SQL is included
        run: |
          docker run --rm --entrypoint python manzil-ai:ci \
            -c "from pathlib import Path; root = Path('/app/migrations'); assert all((root / name).is_file() for name in ['001_schema_v1.sql', '002_tenant_rls.sql']); print('Schema and RLS SQL are included')"

      - name: Verify both container roles
        shell: bash
        run: |
          set -euo pipefail

          trap 'docker logs ci-web; docker logs ci-worker; docker rm -f ci-web ci-worker' EXIT

          docker run -d --name ci-web -p 8000:8000 manzil-ai:ci web
          docker run -d --name ci-worker manzil-ai:ci worker

          curl --fail --retry 10 --retry-all-errors --retry-delay 1 \
            --connect-timeout 2 --max-time 5 http://localhost:8000/live

          test "$(docker inspect -f '{{.State.Running}}' ci-web)" = "true"
          test "$(docker inspect -f '{{.State.Running}}' ci-worker)" = "true"

          WEB_IMAGE=$(docker inspect -f '{{.Image}}' ci-web)
          WORKER_IMAGE=$(docker inspect -f '{{.Image}}' ci-worker)
          test "$WEB_IMAGE" = "$WORKER_IMAGE"
